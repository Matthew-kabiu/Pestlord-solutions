name: pestlord-production
services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE}:${PESTLORD_VERSION:?Set PESTLORD_VERSION}
    init: true
    env_file: .env.production
    environment:
      NODE_ENV: production
    ports:
      - "${APP_HOST:?Set APP_HOST}:${APP_PORT:?Set APP_PORT}:${API_PORT:?Set API_PORT}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 100
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://' + process.env.HEALTHCHECK_HOST + ':' + process.env.API_PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
