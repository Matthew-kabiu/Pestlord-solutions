name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare isolated fake environment files
        id: fixtures
        run: npx tsx scripts/ci-env.ts
      - name: Validate both environment contracts
        run: |
          npm run env:validate -- development
          npm run env:validate -- production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:client
      - run: npm run check:workflows
      - run: npm audit --omit=dev
      - name: Validate both Compose configurations
        run: |
          npm run compose:dev -- config --quiet
          npm run compose:prod -- config --quiet
